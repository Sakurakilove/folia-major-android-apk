name: folia_mobile
description: "Folia implementation migration; exact original frontend parity is required before delivery."
publish_to: 'none'
version: 0.1.0-alpha.1+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  characters: ^1.4.1
  path_drawing: 1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  shaders:
    - shaders/monet_word.frag
    - shaders/monet_token.frag
    - shaders/liquid_glass.frag
    - shaders/wall_artwork.frag
    - shaders/css_gradient.frag

  assets:
    - assets/ada_url/
    - assets/icu_folia/
    - assets/Unicode-LICENSE.txt
    - assets/motion-dom-LICENSE.md
    - assets/Skia-LICENSE.txt
    - assets/AndroidLiquidGlass.txt
    - assets/LICENSE
    - assets/original/
    - assets/original/locales/
    - assets/original/icons/
